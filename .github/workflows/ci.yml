name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One place to bump the embedded copyparty version; the contract job installs the same version and
  # scripts/check_readme_contract.py keeps the README in sync with it.
  COPYPARTY_VERSION: "1.20.26"
  # Chaquopy needs a build-machine Python whose major.minor matches the app's Python (3.12).
  PYTHON_VERSION: "3.12"

jobs:
  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Caches the Gradle user home (dependencies, wrapper, build cache) between runs.
      - uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Unit tests (domain, config rendering, Robolectric UI)
        run: ./gradlew :core:test :app:testPlayDebugUnitTest --stacktrace

      # Every distribution artifact is built on every run so the release paths cannot rot between
      # tags: Play debug (for the emulator), Play release APK + AAB, and the self-hosted APK.
      # Without keystore secrets app/build.gradle.kts falls back to the debug signing config.
      - name: Assemble Play APKs, Play AAB and self-hosted APK
        run: >-
          ./gradlew :app:assemblePlayDebug :app:assemblePlayRelease
          :app:assembleFossRelease :app:bundlePlayRelease --stacktrace

      # The build variants only mean something if the Play artifact really is policy-clean.
      - name: Verify the Play artifact requests no broad storage access
        run: python3 scripts/check_play_compliance.py

      # Every capability the app can perform needs a control a user can reach. This is the gate for
      # the two shipped UX bugs: `deleteShare` and the All-files-access picker existed with no UI.
      - name: Verify every capability has a reachable control
        run: python3 scripts/check_capability_parity.py

      - name: Lint
        run: ./gradlew :app:lintPlayDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload APKs and the Play AAB
        uses: actions/upload-artifact@v4
        with:
          name: copyparty-apks
          path: |
            app/build/outputs/apk/play/debug/*.apk
            app/build/outputs/apk/play/release/*.apk
            app/build/outputs/apk/foss/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
          retention-days: 14

  config-contract:
    name: Config contract (real copyparty)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      # The copyparty wheel is the slow part of this job; cache it separately from Gradle.
      - name: Cache the copyparty wheel
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ env.PYTHON_VERSION }}-${{ env.COPYPARTY_VERSION }}

      - name: Make the wrapper executable
        run: chmod +x gradlew

      # The workflow and the README are production files in a CI-only project: this fails if a job
      # loses its timeout/cache/artifact, if the release build stops being exercised, or if the
      # README drifts from the versions, tasks and job names above.
      - name: Docs and workflow contract (README, ci.yml and release.yml agree)
        run: |
          python3 scripts/check_ci_contract.py
          python3 scripts/check_readme_contract.py

      - name: Install copyparty (same version as the app embeds)
        run: python3 -m pip install --disable-pip-version-check "copyparty==${COPYPARTY_VERSION}"

      # boot.py is pure Python: on the build machine we can start/stop/restart a real copyparty
      # through the same code path the app uses, without an emulator.
      - name: Boot lifecycle contract (start, stop, restart in one process)
        run: python3 scripts/check_boot_contract.py

      - name: Build the renderer CLI
        run: ./gradlew :core:installDist --stacktrace

      - name: Render a config with the app's renderer and boot real copyparty against it
        run: |
          set -euo pipefail
          WORK="${RUNNER_TEMP}/copyparty-contract"
          rm -rf "$WORK"
          mkdir -p "$WORK"
          python3 scripts/make_contract_state.py "$WORK" > "$WORK/state.json"
          core/build/install/core/bin/core "$WORK/state.json" "$WORK/copyparty.conf"
          echo "--- rendered config ---"
          cat "$WORK/copyparty.conf"
          echo "-----------------------"
          python3 scripts/check_server_contract.py "$WORK"

      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-contract
          path: ${{ runner.temp }}/copyparty-contract
          if-no-files-found: warn
          retention-days: 7

  instrumented:
    name: Android device test (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The self-hosted build is the one with every user-facing capability (All files access, any
      # folder), so the journeys - Home, the picker, the real embedded server, browse, upload and
      # delete - run against it. The plain copyparty boot test runs in the same task.
      - name: Run instrumented test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: |
            set -o pipefail
            ./gradlew :app:connectedFossDebugAndroidTest --stacktrace || {
              # A red emulator job must be diagnosable from its artifacts alone.
              adb logcat -d > "$RUNNER_TEMP/emulator-logcat.txt" 2>/dev/null || true
              adb shell run-as com.peaspilaf.copyparty.debug \
                cat files/copyparty/copyparty.log > "$RUNNER_TEMP/copyparty.log" 2>/dev/null || true
              exit 1
            }

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          retention-days: 7

      - name: Upload emulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-diagnostics
          path: |
            ${{ runner.temp }}/emulator-logcat.txt
            ${{ runner.temp }}/copyparty.log
          if-no-files-found: ignore
          retention-days: 7
