name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # One place to bump the embedded copyparty version; the contract job installs the same version.
  COPYPARTY_VERSION: "1.20.26"

jobs:
  android:
    name: Android build + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Chaquopy needs a build-machine Python whose major.minor matches the app's Python (3.12).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Unit tests (domain, config rendering, Robolectric UI)
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Lint
        run: ./gradlew :app:lintDebug --stacktrace

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/**
            **/build/test-results/**
            **/build/reports/lint-results-debug.html
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: copyparty-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

  config-contract:
    name: Config contract (real copyparty)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Install copyparty (same version as the app embeds)
        run: python3 -m pip install --disable-pip-version-check "copyparty==${COPYPARTY_VERSION}"

      - name: Build the renderer CLI
        run: ./gradlew :core:installDist --stacktrace

      - name: Render a config with the app's renderer and boot real copyparty against it
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"
          python3 scripts/make_contract_state.py "$WORK" > "$WORK/state.json"
          core/build/install/core/bin/core "$WORK/state.json" "$WORK/copyparty.conf"
          echo "--- rendered config ---"
          cat "$WORK/copyparty.conf"
          echo "-----------------------"
          python3 scripts/check_server_contract.py "$WORK"

      - name: Upload contract artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: config-contract
          path: |
            /tmp/contract-*
          retention-days: 7

  instrumented:
    name: Android device test (emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: gradle/actions/setup-gradle@v4

      - name: Make the wrapper executable
        run: chmod +x gradlew

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Proves the embedded CPython + copyparty actually serve files on Android.
      - name: Run instrumented test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: >-
            -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
            -camera-back none -camera-front none
          script: ./gradlew :app:connectedDebugAndroidTest --stacktrace

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: |
            app/build/reports/androidTests/**
            app/build/outputs/androidTest-results/**
          retention-days: 7
