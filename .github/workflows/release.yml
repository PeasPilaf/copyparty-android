name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# A release must never cancel itself halfway through publishing assets.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.12"

jobs:
  release:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: gradle/actions/setup-gradle@v6

      - name: Make the wrapper executable
        run: chmod +x gradlew

      # Optional: a real signing key. Without it the release APK is debug-signed, which is still
      # installable but only suitable for sideloading/testing.
      - name: Decode signing keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build the Play AAB and both release APKs
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: >-
          ./gradlew :app:assemblePlayRelease :app:bundlePlayRelease
          :app:assembleFossRelease --stacktrace

      - name: Verify the Play artifact requests no broad storage access
        run: python3 scripts/check_play_compliance.py

      - name: List artifacts
        run: ls -l app/build/outputs/apk/play/release/ app/build/outputs/apk/foss/release/ app/build/outputs/bundle/playRelease/

      - name: Upload artifacts as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: copyparty-release-artifacts
          path: |
            app/build/outputs/apk/play/release/*.apk
            app/build/outputs/apk/foss/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: |
            app/build/outputs/apk/play/release/*.apk
            app/build/outputs/apk/foss/release/*.apk
            app/build/outputs/bundle/playRelease/*.aab
          generate_release_notes: true
